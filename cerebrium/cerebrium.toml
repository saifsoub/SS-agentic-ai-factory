[cerebrium.deployment]
name = "ss-agentic-ai-factory-dispatch"
python_version = "3.12"
disable_auth = false
include = ["main.py", "cerebrium.toml"]
exclude = [".*"]
use_uv = true
deployment_initialization_timeout = 120

[cerebrium.hardware]
compute = "CPU"
gpu_count = 0
cpu = 1
memory = 1.0

[cerebrium.scaling]
min_replicas = 0
max_replicas = 1
replica_concurrency = 20
scaling_metric = "concurrency_utilization"
scaling_target = 80
scaling_buffer = 0
cooldown = 30
response_grace_period = 900
evaluation_interval_seconds = 30
compute_tier = "interruptible"
roll_out_duration_seconds = 0
